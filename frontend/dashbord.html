<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #f5f7fa;
      --accent-color: #e74c3c;
      --edit-color: #8f8474;
      --text-color: #333;
      --border-color: #e1e8ed;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--secondary-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(74,144,226,0.1);
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }
    button.submit-btn.update-mode {
      background-color: var(--edit-color);
    }
    button.submit-btn:hover {
      background-color: #357abd;
    }
    button.submit-btn.update-mode:hover {
      background-color: #d68910;
    }
    h3 {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-top: 40px;
      color: #2c3e50;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.3s;
    }
    li:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    .emp-info h4 {
      margin: 0 0 6px 0;
      color: #2c3e50;
      font-size: 18px;
    }
    .emp-info p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    .emp-info .salary {
      color: #27ae60;
      font-weight: 600;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button.icon-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: white;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button.icon-btn:hover {
      opacity: 0.9;
    }
    button.edit-btn {
      background-color: var(--edit-color);
    }
    button.delete-btn {
      background-color: var(--accent-color);
    }
  </style>
</head>
<body>
<div class="container">
  <h2 id="formTitle"><i class="fa-solid fa-users"></i> EMPLOYEE MANAGEMENT </h2>
  <form id="employeeForm">
    <input type="hidden" id="employeeId">
    <div class="form-group">
      <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
      <input type="email" id="email" placeholder="john@example.com" required>
    </div>
    <div class="form-group">
      <label for="position"><i class="fa-solid fa-briefcase"></i> Job Position</label>
      <input type="text" id="position" placeholder="Software Engineer" required>
    </div>
    <div class="form-group">
      <label for="salary"><i class="fa-solid fa-indian-rupee-sign"></i> Salary</label>
      <input type="number" id="salary" placeholder="50000" required>
    </div>
    <button type="submit" id="submitBtn" class="submit-btn"><i class="fa-solid fa-plus"></i> Add Employee</button>
  </form>

  <h3>Employee Directory</h3>
  <ul id="employeeList"></ul>
</div>

<script>
  const form = document.getElementById('employeeForm');
  const list = document.getElementById('employeeList');
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const employeeIdInput = document.getElementById('employeeId');

  let employeesData = [];

  const fetchEmployees = async () => {
    const res = await fetch('http://localhost:5000/api/employees');
    employeesData = await res.json();
    renderEmployees();
  };

  const renderEmployees = () => {
    list.innerHTML = employeesData.map(e => `
      <li>
        <div class="emp-info">
          <h4>${e.name}</h4>
          <p><i class="fa-regular fa-envelope"></i> ${e.email} | <i class="fa-solid fa-id-badge"></i> ${e.position}</p>
          <div class="salary"><i class="fa-solid fa-indian-rupee-sign"></i> ${Number(e.salary).toLocaleString('en-IN')}</div>
        </div>
        <div class="btn-group">
          <button class="icon-btn edit-btn" onclick="prepareEdit('${e._id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="icon-btn delete-btn" onclick="deleteEmployee('${e._id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </li>
    `).join('');
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = employeeIdInput.value;
    const employeeData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      position: document.getElementById('position').value,
      salary: document.getElementById('salary').value
    };

    if (id) {
      await fetch(`http://localhost:5000/api/employees/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(employeeData)
      });
    } else {
      await fetch('http://localhost:5000/api/employees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(employeeData)
      });
    }
    resetForm();
    fetchEmployees();
  });

  const prepareEdit = (id) => {
    const emp = employeesData.find(e => e._id === id);
    if (!emp) return;
    
    document.getElementById('name').value = emp.name;
    document.getElementById('email').value = emp.email;
    document.getElementById('position').value = emp.position;
    document.getElementById('salary').value = emp.salary;
    employeeIdInput.value = emp._id;

    formTitle.innerHTML = `<i class="fa-solid fa-user-pen"></i> Edit Employee`;
    submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Update Employee`;
    submitBtn.classList.add('update-mode');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const resetForm = () => {
    form.reset();
    employeeIdInput.value = '';
    formTitle.innerHTML = `<i class="fa-solid fa-users"></i> Add Employee`;
    submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Add Employee`;
    submitBtn.classList.remove('update-mode');
  };

  const deleteEmployee = async (id) => {
    if (confirm('Are you sure you want to delete this employee?')) {
      await fetch(`http://localhost:5000/api/employees/${id}`, { method: 'DELETE' });
      fetchEmployees();
    }
  };

  fetchEmployees();
</script>
</body>
</html>
