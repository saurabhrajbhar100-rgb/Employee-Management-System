<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 300px; margin: 50px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; }
        .tab.active { color: #4a90e2; border-bottom: 2px solid #4a90e2; margin-bottom: -2px; }
        form { display: none; flex-direction: column; gap: 15px; }
        form.active { display: flex; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #357abd; }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <form id="loginForm" class="active" onsubmit="handleAuth(event, 'login')">
        <h2>Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <form id="registerForm" onsubmit="handleAuth(event, 'register')">
        <h2>Register</h2>
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('form').forEach(f => f.classList.remove('active'));
        
        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
    }

    async function handleAuth(event, type) {
        event.preventDefault();
        const isLogin = type === 'login';
        const url = `/api/auth/${type}`;

        const data = isLogin ? {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        } : {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
        };

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                if (isLogin) {
                    localStorage.setItem('token', result.token);
                    alert('Login successful!');
                    window.location.href = 'dashbord.html';
                } else {
                    alert('Registration successful! Please login.');
                    switchTab('login');
                }
            } else {
                alert(result.error);
            }
        } catch (err) {
            alert('Something went wrong.');
        }
    }
</script>

</body>
</html>
